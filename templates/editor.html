{% extends 'base.html' %}{% block content %}
<div class="page-heading"><h1>{{ '编辑文章' if post else '写一篇新文章' }}</h1><a href="{{ url_for('mine') }}">← 我的文章</a></div>
<form method="post" class="panel stack editor"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>文章标题<input name="title" required maxlength="160" value="{{ request.form.get('title',post.title if post else '') }}"></label>
<label>分类<input name="category" required maxlength="30" value="{{ request.form.get('category',post.category if post else '随笔') }}"></label>
<div class="import-bar"><div><strong>导入文章内容</strong><p class="muted">支持 MD / JSON / UTF-8 TXT / DOCX，文件不超过 1MB，正文最多 10 万字。</p></div><label class="button secondary small">选择文件<input type="file" id="document-file" accept=".md,.markdown,.json,.txt,.utf8,.docx,.doc" hidden></label></div><p id="import-status" role="status" class="muted"></p>
<label>正文格式<select name="content_format" id="content-format">{% set fmt=request.form.get('content_format',post.content_format if post else 'html') %}<option value="html" {{ 'selected' if fmt=='html' }}>富文本（图文编辑）</option><option value="markdown" {{ 'selected' if fmt=='markdown' }}>Markdown / Word 转换</option><option value="json" {{ 'selected' if fmt=='json' }}>JSON</option><option value="text" {{ 'selected' if fmt=='text' }}>纯文本（UTF-8 / TXT）</option></select></label>
<label>正文 <span class="muted">可直接输入、粘贴或导入文件</span><textarea name="content" required maxlength="100000" rows="20">{{ request.form.get('content',post.content if post else '') }}</textarea></label>
<div class="actions"><label class="button secondary small" id="image-upload-label">＋ 插入图片<input type="file" id="image-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden multiple></label><span class="muted">每张最多 5MB，支持上传、粘贴或拖入图片</span><button type="button" class="button secondary small" id="preview-button">预览正文</button></div><div id="content-preview" class="prose preview-panel" hidden></div>
<div class="actions"><label class="check"><input type="checkbox" name="published" {% if ('published' in request.form if request.method=='POST' else (post.published if post else true)) %}checked{% endif %}>公开发布（取消则保存为草稿）</label><label class="check"><input type="checkbox" name="comments_open" {% if ('comments_open' in request.form if request.method=='POST' else (post.comments_open if post else true)) %}checked{% endif %}>允许评论</label><button class="button">保存文章 ↗</button></div></form>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='vendor/jquery.min.js') }}"></script><script src="{{ url_for('static',filename='vendor/summernote-lite.min.js') }}"></script><script src="{{ url_for('static',filename='vendor/summernote-zh-CN.min.js') }}"></script><script src="{{ url_for('static',filename='vendor/turndown.js') }}"></script><script src="{{ url_for('static',filename='rich-editor.js',v='20261111b') }}" defer></script>{% endblock %}
