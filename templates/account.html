{% extends 'base.html' %}{% block content %}<section class="panel auth-panel"><span class="eyebrow">ACCOUNT SETTINGS</span><h1>账户设置</h1><p class="muted">{{ g.user.username }} · {{ g.user.email }}</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>当前密码<input name="old_password" type="password" required autocomplete="current-password"></label><label>新密码<span class="password-field"><input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><button type="button" class="eye" aria-label="显示密码">◉</button></span></label><label>确认新密码<input name="confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><button class="button">更新密码</button></form></section>{% endblock %}
